<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ARBERI JUEGO - NIVEL 2 JARDÍN</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:Courier New;
}

#ui-top{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(255,255,255,0.2);
    padding:15px;
    border:2px solid #ffffff;
    color:white;
    z-index:10;
    border-radius:15px;
}

</style>

<script>

AFRAME.registerComponent('motor-gameplay', {

    init:function(){

        this.ultimaPlataforma = null;
        this.puntos =
        parseInt(localStorage.getItem('puntajeAcumulado')) || 0;

        this.keys = {};
        this.puedeSaltar = true;

        this.actualizarUI();

        window.addEventListener('keydown',(e)=>{
            this.keys[e.code]=true;
        });

        window.addEventListener('keyup',(e)=>{
            this.keys[e.code]=false;
        });

        this.el.addEventListener('collide',(e)=>{

            const target = e.detail.body.el;
            if(!target) return;

            if(target.classList.contains('suelo') && target !== this.ultimaPlataforma){

                this.ultimaPlataforma = target;
                this.puntos += 300;
                this.actualizarUI();
            }

            if(target.id==="lava"){
                location.reload();
            }

            if(target.id==="meta"){

                this.puntos += 8000;

                localStorage.setItem('puntajeAcumulado', this.puntos);

                alert("¡NIVEL 2 COMPLETADO!");

                setTimeout(()=>{
                    window.location.href="juego2.html";
                },1500);
            }
        });
    },

    actualizarUI:function(){
        document.querySelector('#puntos-val').innerText = this.puntos;
    },

    tick:function(){

        if(!this.el.body) return;

        let v = this.el.body.velocity;
        let f = 8;

        if(this.keys['KeyW']) v.z = -f;
        else if(this.keys['KeyS']) v.z = f;
        else v.z = 0;

        if(this.keys['KeyA']) v.x = -f;
        else if(this.keys['KeyD']) v.x = f;
        else v.x = 0;

        if(this.keys['Space']){
            if(Math.abs(v.y)<0.1 && this.puedeSaltar){
                v.y = 13;
                this.puedeSaltar = false;
            }
        }else{
            this.puedeSaltar = true;
        }
    }
});

AFRAME.registerComponent('seguir-camara',{

    init:function(){
        this.player = document.querySelector('#jugador');
    },

    tick:function(){
        if(!this.player) return;

        this.el.object3D.position.lerp(
            this.player.object3D.position,
            0.05
        );
    }
});

</script>

</head>

<body>

<div id="ui-top">
🌸 PUNTOS: <span id="puntos-val">0</span>
</div>

<a-scene physics="gravity:-18" background="color:#87CEEB">

<!-- LAVA -->
<a-plane id="lava" static-body position="0 -6 0" rotation="-90 0 0"
width="300" height="300" color="#2E8B57"></a-plane>

<!-- SOL -->
<a-sphere position="0 80 -100" radius="10" color="#FFD700"></a-sphere>

<!-- NUBES -->
<a-sphere position="-20 40 -60" radius="6" color="white"></a-sphere>
<a-sphere position="-15 40 -60" radius="5" color="white"></a-sphere>
<a-sphere position="25 35 -80" radius="7" color="white"></a-sphere>

<!-- CAMINO -->
<a-box class="suelo" static-body position="0 0 0"
width="8" height="0.5" depth="8" color="#8B4513"></a-box>

<a-box class="suelo" static-body position="0 3 -10"
width="6" height="0.5" depth="6" color="#90EE90"></a-box>

<a-box class="suelo" static-body position="4 6 -18"
width="5" height="0.5" depth="5" color="#FFB6C1"></a-box>

<a-box class="suelo" static-body position="-3 9 -26"
width="5" height="0.5" depth="5" color="#FFD700"></a-box>

<a-box class="suelo" static-body position="5 12 -34"
width="4" height="0.5" depth="4" color="#87CEFA"></a-box>

<a-box class="suelo" static-body position="-4 15 -42"
width="4" height="0.5" depth="4" color="#DA70D6"></a-box>

<a-box class="suelo" static-body position="0 18 -52"
width="7" height="0.5" depth="7" color="#00FA9A"></a-box>

<!-- PUENTE GIRATORIO -->
<a-box class="suelo" static-body position="0 24 -78"
width="10" height="0.4" depth="2" color="#00FA9A"
animation="property: rotation; to:0 360 0; dur:4500; loop:true">
</a-box>

<!-- OBSTÁCULOS MEDIOS (NUEVOS) -->

<a-box class="suelo" static-body position="0 27 -86"
width="4" height="0.4" depth="4" color="#FFD700"></a-box>

<a-box class="suelo" static-body position="5 29 -94"
width="4" height="0.4" depth="4" color="#FFB6C1"></a-box>

<a-box class="suelo" static-body position="-5 31 -102"
width="4" height="0.4" depth="4" color="#87CEFA"></a-box>

<a-box class="suelo" static-body position="0 33 -112"
width="6" height="0.4" depth="4" color="#00FA9A"
animation="property: position; to:4 33 -112; dir:alternate; dur:2500; loop:true">
</a-box>

<a-box class="suelo" static-body position="0 35 -124"
width="2" height="0.3" depth="12" color="#FFFFFF"></a-box>

<a-box class="suelo" static-body position="3 38 -136"
width="3" height="0.4" depth="3" color="#DA70D6"></a-box>

<a-box class="suelo" static-body position="-3 40 -144"
width="3" height="0.4" depth="3" color="#FF69B4"></a-box>

<!-- META FINAL -->
<a-box class="suelo" static-body position="0 43 -156"
width="12" height="0.5" depth="12" color="#00FFFF"></a-box>

<a-entity id="meta" static-body position="0 46 -156">

<a-cylinder radius="3" height="6" color="#FF69B4"
animation="property: rotation; to:0 360 0; dur:3000; loop:true">
</a-cylinder>

<a-text value="🌸 NIVEL COMPLETADO 🌸"
align="center" color="white"
position="0 6 0" scale="10 10 10">
</a-text>

</a-entity>

<!-- JUGADOR -->
<a-entity id="jugador" position="0 3 0"
motor-gameplay dynamic-body="mass:2; fixedRotation:true">

<a-sphere radius="0.4" color="#FAFF00"></a-sphere>
<a-sphere position="0 0.5 0" radius="0.25" color="#FAFF00"></a-sphere>

</a-entity>

<!-- CÁMARA -->
<a-entity seguir-camara>
<a-camera position="0 7 14"
look-controls="enabled:false"
wasd-controls="enabled:false">
</a-camera>
</a-entity>

<!-- LUCES -->
<a-light type="ambient" intensity="1"></a-light>

<a-light type="directional" intensity="1.5"
position="10 20 0" color="#ffffff"></a-light>

</a-scene>

</body>
</html>
